server:
  port: 8086

merchant-provider:
  base-url: http://localhost:8087

spring:
  application:
    name: fulfillment-service

  datasource:
    url: jdbc:mysql://localhost:3306/reward_redemption
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      group-id: fulfillment-service

      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.fulfillmentservice.event.RedemptionRequestedEvent

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

resilience4j:
  retry:
    retry-aspect-order: 2
    instances:
      merchantProvider:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.example.fulfillmentservice.merchant.exception.MerchantProviderTimeoutException
          - com.example.fulfillmentservice.merchant.exception.MerchantProviderUnavailableException

  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      merchantProvider:
        register-health-indicator: true

        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50

        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

        record-exceptions:
          - com.example.fulfillmentservice.merchant.exception.MerchantProviderTimeoutException
          - com.example.fulfillmentservice.merchant.exception.MerchantProviderUnavailableException

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - circuitbreakers
          - circuitbreakerevents

  health:
    circuitbreakers:
      enabled: true