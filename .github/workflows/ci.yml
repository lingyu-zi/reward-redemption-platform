name: Reward Platform CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test points processing service
        run: mvn -B -f points-processing-service/pom.xml -Dtest=PointsProcessingServiceTest test